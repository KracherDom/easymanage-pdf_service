# .gitlab-ci.yml - PDF Service GitLab → Railway Deployment
# Single Source of Truth: GitLab CI/CD
# No GitHub, no Railway auto-deploy

image: node:18-slim

stages:
  - test
  - deploy

variables:
  # Node.js settings
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  
  # Railway CLI version
  RAILWAY_CLI_VERSION: "3.5.0"

# Cache node_modules for faster builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - .npm/

# ============================================
# STAGE 1: Tests & Validation
# ============================================

# Lint code (optional - wenn du ESLint hast)
test:lint:
  stage: test
  script:
    - npm ci
    - echo "✅ Dependencies installed"
    # - npm run lint  # Uncomment wenn ESLint konfiguriert
  except:
    - tags
  only:
    - main
    - merge_requests

# Health check test
test:health:
  stage: test
  script:
    - npm ci
    - echo "🧪 Testing service health check..."
    - node -e "console.log('✅ Node.js runtime OK')"
    - node -e "import('./src/pdf.js').then(() => console.log('✅ PDF module loads'))"
  except:
    - tags
  only:
    - main
    - merge_requests

# Validate Dockerfile
test:docker:
  stage: test
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint Dockerfile || echo "⚠️ Dockerfile linting completed"
  allow_failure: true
  only:
    - main
    - merge_requests

# ============================================
# STAGE 2: Deploy to Railway
# ============================================

deploy:production:
  stage: deploy
  image: alpine:latest
  
  before_script:
    # Install dependencies
    - echo "📦 Installing Railway CLI..."
    - apk add --no-cache bash curl nodejs npm
    - npm install -g @railway/cli@${RAILWAY_CLI_VERSION}
    - railway --version
    
    # Validate required variables
    - |
      if [ -z "$RAILWAY_TOKEN" ]; then
        echo "❌ ERROR: RAILWAY_TOKEN is not set!"
        exit 1
      fi
    - |
      if [ -z "$RAILWAY_PROJECT_ID" ]; then
        echo "❌ ERROR: RAILWAY_PROJECT_ID is not set!"
        exit 1
      fi
    - |
      if [ -z "$RAILWAY_SERVICE_ID" ]; then
        echo "❌ ERROR: RAILWAY_SERVICE_ID is not set!"
        exit 1
      fi
    
    - echo "✅ All Railway variables are set"
  
  script:
    # Login to Railway
    - echo "🔐 Authenticating with Railway..."
    - railway login --browserless
    
    # Link to project and service
    - echo "🔗 Linking to Railway project..."
    - railway link ${RAILWAY_PROJECT_ID}
    
    # Show current status
    - echo "📊 Current Railway status:"
    - railway status
    
    # Deploy to Railway
    - echo "🚀 Deploying to Railway..."
    - railway up --service ${RAILWAY_SERVICE_ID} --detach
    
    # Wait for deployment to complete
    - echo "⏳ Waiting for deployment to complete..."
    - sleep 10
    
    # Verify deployment
    - echo "✅ Deployment completed!"
    - railway status
    
  environment:
    name: production
    url: https://$RAILWAY_DOMAIN  # Set in GitLab variables
    deployment_tier: production
  
  only:
    # Only deploy from main branch
    - main
  
  when: manual  # Requires manual trigger for safety
  
  # Retry on failure
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================
# STAGE 3: Post-Deployment Verification
# ============================================

verify:production:
  stage: deploy
  image: curlimages/curl:latest
  
  script:
    - echo "🧪 Verifying production deployment..."
    - sleep 15  # Wait for Railway to start
    
    # Health check
    - |
      if curl -f -s -o /dev/null -w "%{http_code}" https://${RAILWAY_DOMAIN}/health | grep -q "200"; then
        echo "✅ Health check passed!"
      else
        echo "❌ Health check failed!"
        exit 1
      fi
    
    # Test PDF generation endpoint exists
    - |
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://${RAILWAY_DOMAIN}/generate \
        -H "Authorization: Bearer test" \
        -H "Content-Type: application/json" \
        -d '{"html":"<h1>Test</h1>"}')
      
      if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "400" ]; then
        echo "✅ PDF endpoint is responding (auth/validation working)"
      else
        echo "⚠️ Unexpected response: $HTTP_CODE (might be OK)"
      fi
  
  environment:
    name: production
    url: https://$RAILWAY_DOMAIN
  
  only:
    - main
  
  when: on_success  # Only run after successful deploy
  
  allow_failure: true  # Don't fail pipeline if verification has issues

# ============================================
# OPTIONAL: Manual Rollback
# ============================================

rollback:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl nodejs npm
    - npm install -g @railway/cli@${RAILWAY_CLI_VERSION}
  script:
    - echo "⏮️ Rollback Information"
    - echo "Railway doesn't support native rollback via CLI"
    - echo "To rollback, manually trigger this pipeline from a previous commit"
    - railway login --browserless
    - railway link ${RAILWAY_PROJECT_ID}
    - railway status
  environment:
    name: production
    action: prepare
  only:
    - main
  when: manual
